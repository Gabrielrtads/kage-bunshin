name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Concurrency & Security Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite
        shell: pwsh
        run: |
          node scripts/invoke-parallel-runner.test.mjs

  bash-test:
    name: Run Bash Concurrency & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Bash and run regression tests
        run: |
          bash -n scripts/invoke-parallel-runner.sh
          jq --version
          timeout --version
          node --test scripts/invoke-parallel-runner.bash.test.mjs
